# Study models, limits, prices and request settings (PREREGISTRATION.md rev 3.2, §5-§6).
# Read by src/runner.py and src/grade.py. Provider docs read 2026-11-08/09.
#
# Reasoning: each model runs at the lowest reasoning setting its provider documents, logged
# with every call. gpt-oss cannot switch reasoning off ("low" is its floor); Qwen's "none"
# disables it; Gemini's floor is "MINIMAL". No service_tier is ever sent.

defaults:
  temperature: 0.7          # all four models (§6)
  reps: 3
  base_seed: 20261113       # per-call seeds and per-model order derive from this
  max_output_tokens: 1024
  expected_output_tokens: 400   # pacing and cost projection only, until real usage is known
  request_timeout_s: 120

budget:
  hard_stop_usd: 4.50       # total spend on disk (data/raw + data/pilot), all models; runner stops at this
  pilot_warn_usd: 4.00      # the pilot report warns if the projected full run exceeds this

models:
  gpt-oss-120b:
    provider: groq
    model_id: openai/gpt-oss-120b          # Production
    tier: core
    design: full
    interpreter_arm: true                  # C1 and C2 with the interpreter (§8)
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}     # Groq Developer plan; no TPD
    price_usd_per_mtok: {input: 0.15, output: 0.60}
    max_output_tokens: 2048                # reasoning tokens count against this
    reasoning: {reasoning_effort: low, include_reasoning: true}

  gpt-oss-20b:
    provider: groq
    model_id: openai/gpt-oss-20b           # Production
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}
    price_usd_per_mtok: {input: 0.075, output: 0.30}
    max_output_tokens: 2048
    reasoning: {reasoning_effort: low, include_reasoning: true}

  qwen3.8-27b:
    provider: groq
    model_id: qwen/qwen3.8-27b             # PREVIEW: "may be discontinued at short notice"
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 282000}
    price_usd_per_mtok: {input: 0.80, output: 4.00}
    max_output_tokens: 600
    reasoning: {reasoning_effort: none, reasoning_format: parsed}   # JSON mode needs parsed or hidden

  gemini-3.5-flash-lite:
    provider: gemini
    model_id: gemini-3.5-flash-lite        # Stable
    tier: replication
    design: full
    interpreter_arm: false
    limits: {rpm: 15, rpd: 500, tpm: 250000}   # free tier; RPD resets at midnight Pacific
    price_usd_per_mtok: {input: 0.0, output: 0.0}   # free tier
    generation_config: {thinkingConfig: {thinkingLevel: MINIMAL, includeThoughts: false}}

# Scope-accuracy judge (§5). Not a study model; never shown model, condition label or truth.
judge:
  provider: gemini
  model_id: gemma-4-31b-it                 # "The Gemini API supports the following Gemma 4 models"
  # Gemma free-tier limits are not documented (only on AI Studio's live rate-limit page).
  # These conservative values pace the judge; raise them if AI Studio shows more.
  limits: {rpm: 15, rpd: 1000, tpm: 15000}
  price_usd_per_mtok: {input: 0.0, output: 0.0}
  temperature: 0.0
  max_output_tokens: 400
  # JSON mode is not documented for Gemma, so the reply is parsed from text.
  generation_config: {thinkingConfig: {thinkingLevel: MINIMAL}}
  sample_size: 600
  seed: 20261113
