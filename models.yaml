# Study models, judges, limits, prices and request settings (PREREGISTRATION.md §5-§6; judges rev 3.4).
# Read by src/runner.py and src/grade.py. Provider docs read 2026-11-08/09 (OpenRouter 2026-11-10,
# Adaption 2026-11-15).
#
# Reasoning: each model runs at the lowest reasoning setting its provider documents, logged
# with every call. gpt-oss cannot switch reasoning off ("low" is its floor); Qwen's "none"
# disables it; Gemini's floor is "MINIMAL". No service_tier is ever sent.

defaults:
  temperature: 0.7          # all four models (§6)
  reps: 3
  interpreter_conditions: [C1, C2]   # the countermeasure arm (§8); CLAUDE.md cut order step 1 sets [C1]
  base_seed: 20261113       # per-call seeds and per-model order derive from this
  max_output_tokens: 1024
  expected_output_tokens: 400   # pacing and cost projection only, until real usage is known
  request_timeout_s: 120

budget:
  hard_stop_usd: 4.50       # total spend on disk (data/raw + data/pilot), all models; runner stops at this
  pilot_warn_usd: 4.00      # the pilot report warns if the projected full run exceeds this

models:
  gpt-oss-120b:
    provider: groq
    model_id: openai/gpt-oss-120b          # Production
    tier: core
    design: full
    interpreter_arm: true                  # C1 and C2 with the interpreter (§8)
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}     # Groq Developer plan; no TPD
    price_usd_per_mtok: {input: 0.15, output: 0.60}
    max_output_tokens: 2048                # reasoning tokens count against this
    reasoning: {reasoning_effort: low, include_reasoning: true}

  gpt-oss-20b:
    provider: groq
    model_id: openai/gpt-oss-20b           # Production
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}
    price_usd_per_mtok: {input: 0.075, output: 0.30}
    max_output_tokens: 2048
    reasoning: {reasoning_effort: low, include_reasoning: true}

  qwen3.8-27b:
    provider: groq
    model_id: qwen/qwen3.8-27b             # PREVIEW: "may be discontinued at short notice"
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 282000}
    price_usd_per_mtok: {input: 0.80, output: 4.00}
    max_output_tokens: 600
    reasoning: {reasoning_effort: none, reasoning_format: parsed}   # JSON mode needs parsed or hidden

  gemini-3.5-flash-lite:
    provider: gemini
    model_id: gemini-3.5-flash-lite        # Stable
    tier: replication
    design: full
    interpreter_arm: false
    limits: {rpm: 15, rpd: 500, tpm: 250000}   # free tier; RPD resets at midnight Pacific
    price_usd_per_mtok: {input: 0.0, output: 0.0}   # free tier
    generation_config: {thinkingConfig: {thinkingLevel: MINIMAL, includeThoughts: false}}

# Scope-accuracy judge (§5, rev 3.4). Not a study model; never shown the model, condition label or
# truth value. Planned as two OpenRouter judges; from 15 Nov 2026 one judge on Adaption (sponsor
# credits) and no cross-check (DEVIATIONS.md). Its model ID, family and serving provider are chosen
# before any main-data judging and committed here before judging starts; it refuses to run while
# model_id is empty or breaks the §5 criteria: not OpenAI/gpt-oss, Qwen/Alibaba or Google; no router,
# unnamed model or Adaption stack.
judges:
  main:
    provider: adaption           # Adaption Responses API via the `adaption` SDK (ADAPTION_API_KEY in .env)
    model_id: glm-5.2            # listed by client.models.list() on 15 Nov 2026
    family: zhipu                # Z.ai (Zhipu AI), GLM's developer
    route: {order: [adaption], allow_fallbacks: false}   # Adaption serves the model itself; nothing is routed or sent
    temperature: 0.0             # the API accepts 0-2
    reasoning: provider default  # Adaption has no reasoning parameter; logged with every call
    json_mode: none              # no JSON mode on Adaption: the prompt asks for JSON and the parser validates every reply
    max_output_tokens: 4000      # includes reasoning tokens
    concurrency: 8
    limits: {rpm: 120}           # Adaption documents no rate limits; this only spaces the calls
    price_credits_per_mtok: {input: 1.40, cached_input: 0.26, output: 4.40}   # Adaption models page, 15 Nov 2026
    budget_credits: 10.0         # hard stop on the credits computed from those prices
    request_timeout_s: 180
    sample_size: 600
    seed: 20261113               # draws the stratified sample
  # The cross-check judge (§5) was dropped: no second judge, so the kappa gate cannot be evaluated,
  # confirmatory H3 is not tested (Holm p = 1), and the main judge's scores are exploratory and
  # unvalidated. grade.py --crosscheck refuses, and analyse.py reports the scope source "exploratory".
  crosscheck:
    dropped: "15 Nov 2026, by the author's decision; see DEVIATIONS.md"
