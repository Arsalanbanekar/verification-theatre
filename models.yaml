# Study models, judges, limits, prices and request settings (PREREGISTRATION.md §5-§6; judges rev 3.4).
# Read by src/runner.py and src/grade.py. Provider docs read 2026-11-08/09 (OpenRouter 2026-11-10).
#
# Reasoning: each model runs at the lowest reasoning setting its provider documents, logged
# with every call. gpt-oss cannot switch reasoning off ("low" is its floor); Qwen's "none"
# disables it; Gemini's floor is "MINIMAL". No service_tier is ever sent.

defaults:
  temperature: 0.7          # all four models (§6)
  reps: 3
  interpreter_conditions: [C1, C2]   # the countermeasure arm (§8); CLAUDE.md cut order step 1 sets [C1]
  base_seed: 20261113       # per-call seeds and per-model order derive from this
  max_output_tokens: 1024
  expected_output_tokens: 400   # pacing and cost projection only, until real usage is known
  request_timeout_s: 120

budget:
  hard_stop_usd: 4.50       # total spend on disk (data/raw + data/pilot), all models; runner stops at this
  pilot_warn_usd: 4.00      # the pilot report warns if the projected full run exceeds this

models:
  gpt-oss-120b:
    provider: groq
    model_id: openai/gpt-oss-120b          # Production
    tier: core
    design: full
    interpreter_arm: true                  # C1 and C2 with the interpreter (§8)
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}     # Groq Developer plan; no TPD
    price_usd_per_mtok: {input: 0.15, output: 0.60}
    max_output_tokens: 2048                # reasoning tokens count against this
    reasoning: {reasoning_effort: low, include_reasoning: true}

  gpt-oss-20b:
    provider: groq
    model_id: openai/gpt-oss-20b           # Production
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 250000}
    price_usd_per_mtok: {input: 0.075, output: 0.30}
    max_output_tokens: 2048
    reasoning: {reasoning_effort: low, include_reasoning: true}

  qwen3.8-27b:
    provider: groq
    model_id: qwen/qwen3.8-27b             # PREVIEW: "may be discontinued at short notice"
    tier: core
    design: full
    interpreter_arm: true
    limits: {rpm: 1000, rpd: 500000, tpm: 282000}
    price_usd_per_mtok: {input: 0.80, output: 4.00}
    max_output_tokens: 600
    reasoning: {reasoning_effort: none, reasoning_format: parsed}   # JSON mode needs parsed or hidden

  gemini-3.5-flash-lite:
    provider: gemini
    model_id: gemini-3.5-flash-lite        # Stable
    tier: replication
    design: full
    interpreter_arm: false
    limits: {rpm: 15, rpd: 500, tpm: 250000}   # free tier; RPD resets at midnight Pacific
    price_usd_per_mtok: {input: 0.0, output: 0.0}   # free tier
    generation_config: {thinkingConfig: {thinkingLevel: MINIMAL, includeThoughts: false}}

# Scope-accuracy judges (§5, rev 3.4). Not study models; never shown the model, condition label or
# truth value. Both run on OpenRouter (OPENROUTER_API_KEY in .env), with the same prompt.
# Each model ID, family and serving provider is chosen before any main-data judging and committed
# here before judging starts; the judges refuse to run while model_id is empty or breaks the §5
# criteria: not OpenAI/gpt-oss, Qwen/Alibaba or Google; no router or unnamed model; the main judge
# paid (no :free), the cross-check :free and from a third family.
judges:
  main:
    provider: openrouter
    model_id:                    # chosen from the candidates (RUNBOOK.md section 9), e.g. <author>/<model>
    family:                      # e.g. the developer, recorded when chosen; the cross-check must differ
    route: {order: [], allow_fallbacks: false, require_parameters: true}   # order: [<provider slug>]
    temperature: 0.0
    reasoning:                   # fixed when chosen, e.g. {effort: low}; logged with every call
    json_mode: json_schema       # or json_object, whichever the pinned provider supports
    max_output_tokens: 4000      # includes reasoning tokens on OpenRouter
    concurrency: 8
    limits: {rpm: 120}           # paid models have no OpenRouter request cap; this only spaces the calls
    budget_usd: 3.00             # hard stop on OpenRouter's measured cost for this judge
    request_timeout_s: 180
    sample_size: 600
    seed: 20261113               # draws the stratified sample
  crosscheck:
    provider: openrouter
    model_id:                    # a :free model from a third family, e.g. <author>/<model>:free
    family:
    route: {order: [], allow_fallbacks: false, require_parameters: true}
    temperature: 0.0
    reasoning:
    json_mode: json_schema
    max_output_tokens: 4000
    concurrency: 2
    # Free models: 20 requests a minute, 50 a day under 10 credits bought (OpenRouter, per UTC day).
    # rpd is a hard stop per UTC day, counting every attempt, failed ones included.
    limits: {rpm: 15, rpd: 48}
    budget_usd: 0.0              # a :free model costs nothing; any charge stops it
    request_timeout_s: 180
    sample_size: 100             # a subset of the main judge's sample, stratified the same way
    seed: 20261114
